client_id = "c4aa521b743779cc485898c2803f6480"
name = "Neryn"
handle = "neryn"
application_url = "https://neryn.pro/shopify/auth"
embedded = true

[access_scopes]
# Every scope here is justified by a call in the codebase — App Store review
# asks what each one is for, and a merchant approves this list verbatim.
#
#   read_products      products/variants/collections queries in lib/shopify/sync.ts,
#                      plus the PRODUCTS_CREATE/UPDATE/DELETE webhooks
#   read_inventory     variant inventoryItem levels in lib/shopify/sync.ts,
#                      plus the INVENTORY_LEVELS_UPDATE webhook
#   read_orders        orders/fulfillments/trackingInfo in lib/shopify/client.ts
#                      (order status lookups), plus the ORDERS_* webhooks
#   read_customers     the CUSTOMERS_CREATE/UPDATE webhooks
#   read_script_tags   checking for an existing widget script before installing
#   write_script_tags  scriptTagCreate/scriptTagDelete — installs and removes the
#                      storefront chat widget. The only write the app performs.
#
# Removed 2026-07-29 because nothing in src/ used them: write_products,
# write_product_listings, write_orders, write_customers, write_cart_transforms,
# read_product_listings, read_cart_transforms, read_customer_events, and the
# three unauthenticated_read_* Storefront scopes (the widget reads the synced
# catalog from this app's own database, never the Storefront API).
scopes = "read_products,read_inventory,read_orders,read_customers,read_script_tags,write_script_tags"

[auth]
redirect_urls = [
  "https://neryn.pro/api/shopify/callback"
]

[webhooks]
api_version = "2025-01"

  [webhooks.privacy_compliance]
  customer_data_request_url = "https://neryn.pro/api/webhooks/shopify"
  customer_deletion_url = "https://neryn.pro/api/webhooks/shopify"
  shop_deletion_url = "https://neryn.pro/api/webhooks/shopify"

  [[webhooks.subscriptions]]
  topics = [
    "app/uninstalled",
    "app_subscriptions/update"
  ]
  uri = "https://neryn.pro/api/webhooks/shopify"

  [[webhooks.subscriptions]]
  topics = [
    "products/create",
    "products/update",
    "products/delete"
  ]
  uri = "https://neryn.pro/api/webhooks/shopify"

  [[webhooks.subscriptions]]
  topics = [
    "orders/create",
    "orders/updated"
  ]
  uri = "https://neryn.pro/api/webhooks/shopify"

  [[webhooks.subscriptions]]
  topics = [
    "customers/create",
    "customers/update"
  ]
  uri = "https://neryn.pro/api/webhooks/shopify"

  [[webhooks.subscriptions]]
  topics = [
    "inventory_levels/update"
  ]
  uri = "https://neryn.pro/api/webhooks/shopify"

[pos]
embedded = false
